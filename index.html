<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปฏิทินงานก่อสร้างพัทยา 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E0D1; --paper-card:#F3EFE4; --ink:#20242A; --ink-soft:#585A52;
  --grid-line:#C9C2AD; --navy:#1D3346; --navy-line:rgba(255,255,255,.14); --paper-on-navy:#D7E0E6;
  --safety:#F0B429; --signal:#2F6F4E; --signal-bg:#CFE3D3; --rust:#A6431E; --rust-bg:#F3D6CC;
  --yellow-bg:#FCE8B2; --yellow-line:#C98A12;
  --display:'Big Shoulders Display',sans-serif; --body:'IBM Plex Sans Thai',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);}
.topbar{background:var(--navy);color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.brand{font-family:var(--display);font-weight:800;font-size:22px;}
.brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--safety);letter-spacing:1px;text-transform:uppercase;}
.topbar-links{display:flex;gap:8px;margin-left:auto;}
.topbar-data-link{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:7px 13px;font-size:12.5px;}
.topbar-data-link:hover{background:rgba(255,255,255,.2);}
#banner{background:var(--rust);color:#fff;padding:8px 26px;font-size:13px;display:none;}
#banner.show{display:block;}

.tabs{display:flex;gap:8px;padding:14px 26px 0;flex-wrap:wrap;align-items:center;}
.tabs .hint{font-size:12px;color:var(--ink-soft);margin-right:4px;}
.filter-chip{padding:7px 14px;border-radius:16px;background:var(--paper-card);border:1.5px solid var(--grid-line);cursor:pointer;font-size:13px;color:var(--ink-soft);user-select:none;transition:.15s;}
.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;}
.filter-chip:hover{opacity:.85;}
.chip-sheet-tag{font-weight:700;text-decoration:underline;opacity:.85;margin-right:3px;}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.icon-btn{background:var(--paper-card);color:var(--ink);border:1.5px solid var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;font-size:13.5px;}
.icon-btn:hover{background:var(--safety);}
.data-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap;}

.gallery-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.success-modal-body{background:#F6F4EC;border:1px solid var(--grid-line);border-radius:8px;padding:14px;margin:10px 0;font-size:13.5px;line-height:1.9;}
.success-modal-body b{color:var(--navy);}
.success-check{width:44px;height:44px;border-radius:50%;background:var(--signal-bg);border:2px solid var(--signal);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px;}

.controls{max-width:1200px;margin:0 auto;padding:16px 26px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.month-switch{display:flex;align-items:center;gap:14px;}
.month-switch button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper-card);cursor:pointer;font-size:16px;}
.month-switch button:hover{background:var(--safety);}
.month-title{font-family:var(--display);font-size:26px;font-weight:700;min-width:220px;text-align:center;}
.legend{display:flex;gap:14px;font-size:12.5px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;}
.add-btn{background:var(--ink);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:13.5px;}
.add-btn:hover{opacity:.85;}

.cal-wrap{max-width:1200px;margin:16px auto 40px;padding:0 26px;}
.cal{background:var(--paper-card);border:1px solid var(--grid-line);border-radius:6px;overflow:hidden;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy);}
.cal-head div{padding:8px 0;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--paper-on-navy);text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day{min-height:108px;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);padding:6px;position:relative;}
.day.out{background:#DAD6C7;}
.day .num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
.day.today .num{background:var(--ink);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;}
.chip{margin-top:4px;padding:2px 6px;border-radius:4px;font-size:11px;line-height:1.3;cursor:pointer;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip.not-started{background:var(--rust-bg);border-color:var(--rust);color:#5b2a1a;}
.chip.in-progress{background:var(--yellow-bg);border-color:var(--yellow-line);color:#5b3e00;}
.chip.done{background:var(--signal-bg);border-color:var(--signal);color:#183a28;}
.more{font-size:10.5px;color:var(--ink-soft);margin-top:2px;cursor:pointer;}

.overlay{position:fixed;inset:0;background:rgba(20,22,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.overlay.show{display:flex;}

.lightbox{position:fixed;inset:0;background:rgba(10,10,10,.94);display:none;align-items:center;justify-content:center;z-index:80;touch-action:pan-y;}
.lightbox.show{display:flex;}
.lightbox img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:4px;user-select:none;-webkit-user-drag:none;}
.lb-close{position:absolute;top:16px;right:18px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1;padding:6px 10px;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:34px;width:52px;height:64px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.lb-nav:hover{background:rgba(255,255,255,.22);}
.lb-prev{left:10px;}
.lb-next{right:10px;}
.lb-counter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:20px;}
@media (max-width:700px){
  .lb-nav{width:42px;height:56px;font-size:28px;}
  .lb-close{font-size:22px;top:10px;right:10px;}
}
.modal{background:#fff;border-radius:8px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:22px;}
.modal h3{font-family:var(--display);font-size:22px;margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.field input, .field select{width:100%;padding:8px 10px;border:1px solid var(--grid-line);border-radius:5px;font-family:var(--body);font-size:14px;}
.field .readonly{padding:8px 10px;background:#F0EEE5;border-radius:5px;font-size:13.5px;color:var(--ink-soft);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
.btn{padding:9px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13.5px;}
.btn.save{background:var(--ink);color:#fff;}
.btn.cancel{background:#EDEBE1;color:var(--ink);}
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;margin-bottom:10px;}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.gallery img{width:100%;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--grid-line);}
.gallery-note{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.last-mod{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px;}

@media (max-width:700px){
  .topbar{padding:12px 14px;}
  .brand{font-size:18px;}
  .topbar-data-link{padding:6px 10px;font-size:11.5px;}
  #banner{padding:8px 14px;font-size:12px;}
  .tabs{padding:12px 14px 0;gap:6px;}
  .filter-chip{padding:6px 11px;font-size:12px;}
  .controls{padding:14px 14px 0;gap:10px;flex-direction:column;align-items:stretch;}
  .month-switch{justify-content:center;}
  .legend{justify-content:center;font-size:11.5px;gap:10px;}
  .btn-row{justify-content:center;}
  .icon-btn, .add-btn{flex:1 1 auto;text-align:center;padding:10px 10px;font-size:12.5px;}
  .cal-wrap{padding:0 8px;margin:12px auto 24px;}
  .cal-head div{font-size:10px;padding:6px 0;}
  .day{min-height:78px;padding:4px;}
  .day .num{font-size:11px;}
  .chip{font-size:9.5px;padding:2px 4px;}
  .chip-sheet-tag{display:block;}
  .more{font-size:9.5px;}
  .month-title{font-size:20px;min-width:0;}
  .modal{padding:16px;border-radius:10px;max-height:94vh;}
  .modal h3{font-size:19px;}
  .two-col{grid-template-columns:1fr;}
  .gallery{grid-template-columns:repeat(2,1fr);}
  .gallery img{height:90px;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-actions .btn{width:100%;}
}
@media (max-width:420px){
  .day{min-height:64px;}
  .chip{white-space:normal;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SITE//CALENDAR<small>ปฏิทินงานก่อสร้างพัทยา · เชื่อมสด Google Sheets</small></div>
  <div class="topbar-links">
    <a class="icon-btn data-link topbar-data-link" href="#" id="data1-btn" target="_blank" rel="noopener">📊 DATA1</a>
    <a class="icon-btn data-link topbar-data-link" href="#" id="data2-btn" target="_blank" rel="noopener">🖼️ DATA2</a>
  </div>
</div>
<div id="banner"></div>

<div class="tabs" id="tabs">
  <span class="hint">แสดงงานประเภท:</span>
</div>

<div class="controls">
  <div class="month-switch">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="month-title"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="legend">
    <span><i style="background:var(--rust-bg);border:1px solid var(--rust)"></i>ยังไม่เริ่ม</span>
    <span><i style="background:var(--yellow-bg);border:1px solid var(--yellow-line)"></i>กำลังดำเนินการ</span>
    <span><i style="background:var(--signal-bg);border:1px solid var(--signal)"></i>เสร็จแล้ว</span>
  </div>
  <div class="btn-row">
    <button class="icon-btn" onclick="openGallery()">📐 ดูแบบก่อสร้าง</button>
    <button class="add-btn" onclick="openModal(null)">+ เพิ่มงานใหม่</button>
  </div>
</div>

<div class="cal-wrap">
  <div class="cal">
    <div class="cal-head" id="cal-head"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">รายละเอียดงาน</h3>
    <div id="modal-status"></div>
    <div class="field">
      <label>หมวดงาน (ชีต) — เลือกจากลิสต์ หรือพิมพ์ชื่อใหม่เพื่อสร้างแท็บใหม่ในชีต</label>
      <input type="text" id="f-sheet" list="sheet-list" onchange="onSheetChange()">
      <datalist id="sheet-list"></datalist>
    </div>
    <div class="two-col">
      <div class="field"><label>วันที่เริ่ม</label><input type="date" id="f-start"></div>
      <div class="field"><label>วันที่สิ้นสุด</label><input type="date" id="f-end"></div>
    </div>
    <div class="field"><label>งาน</label><input type="text" id="f-task" placeholder="เช่น ตอกเข็ม, วางท่อระบายน้ำ"></div>
    <div class="field"><label>ชื่อผู้แก้ไข (จะบันทึกไว้ในคอลัมน์ D)</label><input type="text" id="f-editor" placeholder="พิมพ์ชื่อของคุณ"></div>

    <div id="gallery-wrap" style="display:none;">
      <label style="font-size:12.5px;color:var(--ink-soft);">รูปภาพหน้างานที่เกี่ยวข้อง</label>
      <div class="gallery" id="gallery"></div>
      <div class="gallery-note" id="gallery-note"></div>
    </div>
    <div class="last-mod" id="last-mod"></div>

    <div class="modal-actions">
      <button class="btn cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn save" onclick="saveTask()">บันทึก</button>
    </div>
  </div>
</div>

<!-- ป็อปอัพสรุปหลังบันทึกสำเร็จ (ไว้แคปหน้าจอส่งต่อได้) -->
<div class="overlay" id="successOverlay">
  <div class="modal" style="max-width:420px;text-align:center;">
    <div class="success-check">✓</div>
    <h3 id="success-title" style="text-align:center;">บันทึกสำเร็จ</h3>
    <div class="success-modal-body" id="success-content" style="text-align:left;"></div>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn save" onclick="closeSuccessModal()">ตกลง</button>
    </div>
  </div>
</div>

<!-- คลังรูปภาพหน้างาน แยกตามหมวดงาน -->
<div class="overlay" id="galleryOverlay">
  <div class="modal" style="max-width:560px;">
    <h3>แบบก่อสร้าง</h3>
    <div class="field">
      <label>เลือกหมวดงาน (ชื่อโฟลเดอร์ใน Drive ตรงกับหมวดงาน)</label>
      <div class="gallery-cats" id="gallery-cats"></div>
    </div>
    <div class="gallery" id="gallery-browse"></div>
    <div class="gallery-note" id="gallery-browse-note"></div>
    <div class="modal-actions">
      <button class="btn cancel" onclick="closeGallery()">ปิด</button>
    </div>
  </div>
</div>

<!-- ไลท์บ็อกซ์ดูรูปเต็มจอ เลื่อนซ้าย-ขวาดูทีละรูป (คลิกลูกศร/ปัดนิ้ว/กดปุ่มลูกศรคีย์บอร์ดได้) -->
<div class="lightbox" id="lightbox" onclick="lightboxBackdropClick(event)">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="event.stopPropagation();lightboxNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" onclick="event.stopPropagation();lightboxNav(1)">›</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
// ==================== ตั้งค่า ====================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFNnpz1L6-n0rb3YFDK5uLyPpXdF4vox3h1Md7ZkyXce_HgvJpSZfg0BwwD1cInAf1/exec';
// ลิงก์ด่วนไปยัง Google Drive: DATA1 = ชีตข้อมูลหลัก, DATA2 = โฟลเดอร์เก็บรูปภาพหน้างาน
const DATA1_URL = 'https://docs.google.com/spreadsheets/d/1QlIXGMLY6cqY7ctJnw_2RI67MO6D0f8DKRxys1sBrfc/edit?usp=sharing';
const DATA2_URL = 'https://drive.google.com/drive/folders/1UP1YBOJ435aGd3nhSzkO2Z2h1MhgQfBF?usp=sharing';
// แก้บั๊กสำคัญ: ห้ามใช้ .toISOString() กับวันที่ local เพราะมันแปลงเป็น UTC ก่อน
// ซึ่งในโซนเวลาไทย (UTC+7) จะทำให้วันที่เพี้ยนถอยหลังไป 1 วันเสมอ (เช่น 20/7/2569 กลายเป็น 19/7/2569)
// ทำให้งานที่ควรขึ้นวันที่ 20 ไปโผล่วันที่ 21 แทน หรือดูเหมือนหายไปจากวันที่ควรจะเป็น
function toLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

const DEFAULT_SHEET_NAMES = ['อาคารโกดัง','ระบบน้ำ','คอกทราย','ห้องพัก','ออฟฟิศ'];
// รายชื่อหมวดงานแบบไดนามิก: รวมหมวดเริ่มต้น + หมวดใหม่ที่ถูกพิมพ์เพิ่มเข้ามาและมีอยู่จริงใน STORE แล้ว
function currentSheetNames(){
  if (!STORE) return DEFAULT_SHEET_NAMES;
  const fromStore = Object.keys(STORE);
  const ordered = DEFAULT_SHEET_NAMES.filter(s=>fromStore.includes(s));
  const extra = fromStore.filter(s=>!DEFAULT_SHEET_NAMES.includes(s));
  return [...ordered, ...extra];
}

// ข้อมูลสำรอง (จากไฟล์ต้นฉบับ) ใช้แสดงผลตัวอย่างก่อนที่จะตั้งค่า APPS_SCRIPT_URL จริง
const FALLBACK_DATA = {
  data: {
    'อาคารโกดัง': { rows: [
      {rowIndex:2, start:'2026-07-20', end:'2026-07-20', task:'ตอกเข็ม', lastModified:''},
      {rowIndex:3, start:'2026-07-21', end:'', task:'ฟุตติ้ง', lastModified:''},
      {rowIndex:4, start:'2026-07-22', end:'', task:'ตั้งเสา', lastModified:''},
      {rowIndex:5, start:'2026-07-29', end:'', task:'โครงหลังคา', lastModified:''},
      {rowIndex:6, start:'2026-08-08', end:'', task:'ไวเมชพื้นเข้า', lastModified:''},
      {rowIndex:7, start:'2026-08-06', end:'', task:'เมทัลชีทหลังคาเข้า', lastModified:''}
    ] },
    'ระบบน้ำ': { rows: [
      {rowIndex:2, start:'2026-07-17', end:'2026-07-17', task:'รถแบคโฮเข้าขุดวางท่อระบายน้ำ คสล.+วางผังปักหมุดรอตอกเข็ม', lastModified:''},
      {rowIndex:3, start:'2026-07-18', end:'', task:'วางท่อระบายน้ำ', lastModified:''}
    ] },
    'คอกทราย': { rows: [
      {rowIndex:2, start:'2026-07-17', end:'2026-07-17', task:'รถแบคโฮเข้าขุดวางท่อระบายน้ำ คสล.+วางผังปักหมุดรอตอกเข็ม', lastModified:''},
      {rowIndex:3, start:'2026-07-18', end:'', task:'วางท่อระบายน้ำ', lastModified:''},
      {rowIndex:4, start:'2026-07-20', end:'2026-07-20', task:'ตอกเข็ม', lastModified:''},
      {rowIndex:5, start:'2026-07-21', end:'', task:'ฟุตติ้ง', lastModified:''},
      {rowIndex:6, start:'2026-07-22', end:'', task:'ตั้งเสา', lastModified:''},
      {rowIndex:7, start:'2026-07-29', end:'', task:'โครงหลังคา', lastModified:''},
      {rowIndex:8, start:'2026-08-05', end:'', task:'ไวเมชพื้นเข้า', lastModified:''},
      {rowIndex:9, start:'2026-08-06', end:'', task:'เมทัลชีทหลังคาเข้า', lastModified:''}
    ] },
    'ห้องพัก': { rows: [] },
    'ออฟฟิศ': { rows: [] }
  },
  today: toLocalISO(new Date())
};

// ==================== สถานะแอป ====================
let STORE = null;
let TODAY = null;
let activeSheets = new Set(DEFAULT_SHEET_NAMES); // ทุกหมวดงานแสดงพร้อมกันโดยไม่ต้องเลือก (คลิกเพื่อซ่อน/แสดงได้)
let currentGallerySheet = null; // หมวดงานที่เลือกอยู่ในคลังรูปภาพ
let viewYear, viewMonth; // ค.ศ. (Gregorian) ภายใน, แสดงผลเป็น พ.ศ.
let editing = null; // {sheet, rowIndex} หรือ null = งานใหม่

async function loadData(){
  if (APPS_SCRIPT_URL === 'PASTE_YOUR_WEB_APP_URL_HERE') {
    showBanner('ยังไม่ได้เชื่อมกับ Google Sheets จริง — กำลังแสดงข้อมูลตัวอย่างจากไฟล์ต้นฉบับ ให้นำ Web App URL จาก Apps Script มาใส่ในตัวแปร APPS_SCRIPT_URL');
    STORE = FALLBACK_DATA.data;
    TODAY = FALLBACK_DATA.today;
  } else {
    try{
      const res = await fetch(APPS_SCRIPT_URL);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'โหลดข้อมูลไม่สำเร็จ');
      STORE = json.data;
      TODAY = json.today;
      hideBanner();
    }catch(err){
      showBanner('เชื่อมต่อ Google Sheets ไม่สำเร็จ (' + err.message + ') — แสดงข้อมูลตัวอย่างแทน');
      STORE = FALLBACK_DATA.data;
      TODAY = FALLBACK_DATA.today;
    }
  }
  const t = new Date(TODAY);
  viewYear = t.getFullYear(); viewMonth = t.getMonth();
  // หมวดงานใหม่ (แท็บใหม่ที่เพิ่งถูกสร้าง) ให้แสดงในปฏิทินโดยอัตโนมัติด้วย
  currentSheetNames().forEach(s=>activeSheets.add(s));
  renderTabs(); renderCalendar();
}

function showBanner(msg){ const b=document.getElementById('banner'); b.textContent=msg; b.classList.add('show'); }
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = '<span class="hint">แสดงงานประเภท:</span>' + currentSheetNames().map(s =>
    `<div class="filter-chip ${activeSheets.has(s)?'active':''}" onclick="toggleSheetFilter('${s}')">${s}</div>`).join('');
}
function toggleSheetFilter(s){
  if (activeSheets.has(s)) activeSheets.delete(s); else activeSheets.add(s);
  renderTabs(); renderCalendar();
}

function taskStatus(row){
  if (!row.start) return 'not-started';
  const today = new Date(TODAY);
  const start = new Date(row.start);
  if (today < start) return 'not-started';
  if (!row.end) return 'in-progress'; // ยังไม่มีวันที่จบ = ถือว่ากำลังดำเนินการอยู่ (ไม่ควรกลายเป็นเสร็จแล้วทันที)
  const end = new Date(row.end);
  if (today <= end) return 'in-progress';
  return 'done';
}

const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

function changeMonth(dir){
  viewMonth += dir;
  if (viewMonth < 0){ viewMonth = 11; viewYear--; }
  if (viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderCalendar();
}

function renderCalendar(){
  document.getElementById('month-title').textContent = THAI_MONTHS[viewMonth] + ' ' + (viewYear+543);
  document.getElementById('cal-head').innerHTML = THAI_DAYS.map(d=>`<div>${d}</div>`).join('');

  // รวมงานจากทุกหมวด (ชีต) ที่ถูกเลือกให้แสดง เข้าด้วยกัน ไม่ต้องกดเลือกทีละหมวด
  let rows = [];
  currentSheetNames().forEach(sheetName=>{
    if (!activeSheets.has(sheetName)) return;
    const sheetRows = (STORE[sheetName] && STORE[sheetName].rows) || [];
    sheetRows.forEach(r=> rows.push(Object.assign({}, r, {__sheet: sheetName})));
  });

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  let html = '';
  for (let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    let cellDate, out=false;
    if (dayNum < 1){ cellDate = new Date(viewYear, viewMonth-1, daysInPrevMonth + dayNum); out=true; }
    else if (dayNum > daysInMonth){ cellDate = new Date(viewYear, viewMonth+1, dayNum-daysInMonth); out=true; }
    else { cellDate = new Date(viewYear, viewMonth, dayNum); }

    const iso = toLocalISO(cellDate);
    const isToday = iso === TODAY;
    const dayTasks = rows.filter(r=>{
      if (!r.start) return false;
      const s = r.start;
      // งานที่ยังไม่มีวันที่สิ้นสุด (กำลังดำเนินการ) ให้แสดงสีเหลืองยาวไปจนถึงวันนี้เลย
      // (ถ้ายังไม่ถึงวันเริ่ม ก็ยังไม่แสดงอะไรก่อนวันเริ่ม)
      const e = r.end || (TODAY >= s ? TODAY : s);
      return iso >= s && iso <= e;
    });
    const shown = dayTasks.slice(0,4);
    const extra = dayTasks.length - shown.length;

    html += `<div class="day ${out?'out':''} ${isToday?'today':''}">
      <div class="num">${cellDate.getDate()}</div>
      ${shown.map(r=>{
        const label = (r.task || '(ไม่มีชื่องาน)');
        const tooltip = `${r.__sheet} | ${label}`;
        return `<div class="chip ${taskStatus(r)}" onclick="openModal({sheet:'${r.__sheet}',rowIndex:${r.rowIndex}})" title="${tooltip}"><span class="chip-sheet-tag">${r.__sheet}</span>${label}</div>`;
      }).join('')}
      ${extra>0?`<div class="more">+${extra} งานอื่น</div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function onSheetChange(){
  // ไม่มีลำดับแผน/รายละเอียดแผนแล้ว จึงไม่ต้องทำอะไรเพิ่มตอนเปลี่ยนหมวดงาน
}

function refreshSheetList(currentSheet){
  document.getElementById('sheet-list').innerHTML =
    currentSheetNames().map(s=>`<option value="${s}">`).join('');
}

async function openModal(ref){
  editing = ref;
  document.getElementById('gallery-wrap').style.display = 'none';
  document.getElementById('gallery').innerHTML = '';
  document.getElementById('modal-status').innerHTML = '';
  document.getElementById('last-mod').textContent = '';

  let row = null;
  if (ref){
    row = (STORE[ref.sheet].rows || []).find(r=>r.rowIndex===ref.rowIndex);
  }
  const modalSheet = ref ? ref.sheet : (currentSheetNames().find(s=>activeSheets.has(s)) || currentSheetNames()[0]);
  refreshSheetList();
  const sheetInput = document.getElementById('f-sheet');
  sheetInput.value = modalSheet;
  sheetInput.readOnly = !!ref; // แก้ไขงานเดิม ห้ามย้ายหมวดงาน, เพิ่มงานใหม่พิมพ์หมวดใหม่ได้

  document.getElementById('modal-title').textContent = row ? 'แก้ไขงาน — ' + modalSheet : 'เพิ่มงานใหม่';
  document.getElementById('f-start').value = row ? row.start : '';
  document.getElementById('f-end').value = row ? row.end : '';
  document.getElementById('f-task').value = row ? row.task : '';
  document.getElementById('f-editor').value = '';

  if (row){
    const st = taskStatus(row);
    const label = st==='done'?'เสร็จแล้ว':st==='in-progress'?'กำลังดำเนินการ':'ยังไม่เริ่ม';
    const cls = st==='done'?'signal-bg':st==='in-progress'?'yellow-bg':'rust-bg';
    document.getElementById('modal-status').innerHTML = `<span class="status-badge" style="background:var(--${cls})">${label}</span>`;
    if (row.lastModified) document.getElementById('last-mod').textContent = 'แก้ไขล่าสุด: ' + row.lastModified;
    if (row.task){
      document.getElementById('gallery-wrap').style.display = 'block';
      document.getElementById('gallery-note').textContent = 'กำลังโหลดรูป...';
      loadImages(row.task);
    }
  }
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

async function fetchImagesFor(taskName){
  if (APPS_SCRIPT_URL === 'PASTE_YOUR_WEB_APP_URL_HERE'){
    return {ok:false, reason:'no-url'};
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getImages&folder=' + encodeURIComponent(taskName));
    const json = await res.json();
    return json;
  }catch(err){
    return {ok:false, reason:'error', error: err.message};
  }
}

let galleryImagesMap = {}; // เก็บรายการรูปของแต่ละแกลเลอรี ไว้ใช้ตอนเปิดไลท์บ็อกซ์เพื่อเลื่อนซ้าย-ขวา
function renderGalleryInto(galleryId, noteId, taskName, json){
  const galEl = document.getElementById(galleryId);
  const noteEl = document.getElementById(noteId);
  if (json.reason === 'no-url'){
    galEl.innerHTML = '';
    noteEl.textContent = 'ต้องตั้งค่า APPS_SCRIPT_URL ก่อนถึงจะดึงรูปจาก Drive ได้';
    return;
  }
  if (json.ok && json.images && json.images.length){
    galleryImagesMap[galleryId] = json.images;
    galEl.innerHTML = json.images.map((im,idx)=>`<img src="${im.url}" alt="${im.name}" title="คลิกเพื่อดูรูปเต็มจอ" onclick="openLightbox('${galleryId}', ${idx})">`).join('');
    noteEl.textContent = json.images.length + ' รูป (คลิกรูปเพื่อดูเต็มจอ เลื่อนซ้าย-ขวาดูรูปอื่นได้)';
  } else {
    galleryImagesMap[galleryId] = [];
    galEl.innerHTML = '';
    noteEl.textContent = json.ok
      ? ('ยังไม่พบรูปในโฟลเดอร์ "' + taskName + '" ใน Drive')
      : ('โหลดรูปไม่สำเร็จ: ' + (json.error || 'ไม่ทราบสาเหตุ'));
  }
}

async function loadImages(taskName){
  document.getElementById('gallery-note').textContent = 'กำลังโหลดรูป...';
  const json = await fetchImagesFor(taskName);
  renderGalleryInto('gallery', 'gallery-note', taskName, json);
}

// ==================== แบบก่อสร้าง (ปุ่ม "ดูแบบก่อสร้าง") ====================
// โฟลเดอร์ใน Drive ตั้งชื่อตรงกับหมวดงาน (ชื่อชีต) เลย เช่น "อาคารโกดัง", "ระบบน้ำ"
function openGallery(){
  document.getElementById('gallery-cats').innerHTML = currentSheetNames().map(s=>
    `<div class="filter-chip" id="gcat-${s}" onclick="selectGalleryCategory('${s}')">${s}</div>`).join('');
  selectGalleryCategory(currentSheetNames()[0]);
  document.getElementById('galleryOverlay').classList.add('show');
}
function closeGallery(){ document.getElementById('galleryOverlay').classList.remove('show'); }

async function selectGalleryCategory(sheet){
  currentGallerySheet = sheet;
  currentSheetNames().forEach(s=>{
    const el = document.getElementById('gcat-'+s);
    if (el) el.classList.toggle('active', s===sheet);
  });
  document.getElementById('gallery-browse-note').textContent = 'กำลังโหลดแบบก่อสร้าง...';
  const json = await fetchImagesFor(sheet);
  renderGalleryInto('gallery-browse', 'gallery-browse-note', sheet, json);
}

async function saveTask(){
  const editorName = document.getElementById('f-editor').value.trim();
  if (!editorName){ alert('กรุณาพิมพ์ชื่อผู้แก้ไขก่อนบันทึก'); return; }
  const sheet = document.getElementById('f-sheet').value.trim();
  if (!sheet){ alert('กรุณาเลือกหรือพิมพ์ชื่อหมวดงานก่อนบันทึก'); return; }
  const isNew = !editing;
  const isNewSheet = !currentSheetNames().includes(sheet);
  const payload = {
    action: editing ? 'updateRow' : 'addRow',
    sheet: sheet,
    isNewSheet: isNewSheet, // true = หมวดงานนี้ยังไม่มีอยู่ ให้ Apps Script สร้างแท็บใหม่ในชีต
    rowIndex: editing ? editing.rowIndex : undefined,
    start: document.getElementById('f-start').value,
    end: document.getElementById('f-end').value,
    task: document.getElementById('f-task').value,
    editorName: editorName
  };
  if (APPS_SCRIPT_URL === 'PASTE_YOUR_WEB_APP_URL_HERE'){
    alert('ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL จึงบันทึกจริงไม่ได้ (นี่คือโหมดตัวอย่าง)');
    return;
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'บันทึกไม่สำเร็จ');
    await loadData();
    showSuccessModal(isNew, payload);
  }catch(err){
    alert('บันทึกไม่สำเร็จ: ' + err.message);
  }
}

function fmtThaiDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  return d.getDate() + ' ' + THAI_MONTHS[d.getMonth()] + ' ' + (d.getFullYear()+543);
}

function showSuccessModal(isNew, payload){
  closeModal();
  document.getElementById('success-title').textContent = isNew ? 'เพิ่มงานใหม่สำเร็จ ✅' : 'แก้ไขงานสำเร็จ ✅';
  document.getElementById('success-content').innerHTML = `
    <div><b>หมวดงาน:</b> ${payload.sheet}${payload.isNewSheet ? ' (สร้างแท็บใหม่)' : ''}</div>
    <div><b>งาน:</b> ${payload.task || '(ไม่มีชื่องาน)'}</div>
    <div><b>วันที่เริ่ม:</b> ${fmtThaiDate(payload.start)}</div>
    <div><b>วันที่สิ้นสุด:</b> ${payload.end ? fmtThaiDate(payload.end) : 'ยังไม่กำหนด (กำลังดำเนินการ)'}</div>
    <div><b>ผู้บันทึก:</b> ${payload.editorName}</div>
  `;
  document.getElementById('successOverlay').classList.add('show');
}
function closeSuccessModal(){
  document.getElementById('successOverlay').classList.remove('show');
}

// ==================== ไลท์บ็อกซ์ดูรูปเต็มจอ (เลื่อนซ้าย-ขวา) ====================
let lightboxImages = [];
let lightboxIndex = 0;
function openLightbox(galleryId, idx){
  lightboxImages = galleryImagesMap[galleryId] || [];
  if (!lightboxImages.length) return;
  lightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('show');
}
function renderLightbox(){
  const im = lightboxImages[lightboxIndex];
  if (!im) return;
  document.getElementById('lb-img').src = im.url;
  document.getElementById('lb-img').alt = im.name;
  document.getElementById('lb-counter').textContent = (lightboxIndex+1) + ' / ' + lightboxImages.length;
}
function lightboxNav(delta){
  if (!lightboxImages.length) return;
  lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
function lightboxBackdropClick(ev){
  // ปิดไลท์บ็อกซ์เมื่อคลิกพื้นหลังสีดำ (ไม่ใช่ตัวรูปหรือปุ่ม)
  if (ev.target.id === 'lightbox') closeLightbox();
}
document.addEventListener('keydown', (ev)=>{
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (ev.key === 'ArrowLeft') lightboxNav(-1);
  else if (ev.key === 'ArrowRight') lightboxNav(1);
  else if (ev.key === 'Escape') closeLightbox();
});
// รองรับปัดนิ้วซ้าย-ขวาบนมือถือ
(function(){
  let touchStartX = null;
  const lb = document.getElementById('lightbox');
  lb.addEventListener('touchstart', e=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e=>{
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){ dx < 0 ? lightboxNav(1) : lightboxNav(-1); }
    touchStartX = null;
  }, {passive:true});
})();

document.getElementById('data1-btn').href = DATA1_URL;
document.getElementById('data2-btn').href = DATA2_URL;
loadData();
